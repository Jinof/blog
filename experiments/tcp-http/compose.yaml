services:
  client:
    build: ./client
    cap_add:
      - NET_ADMIN
    environment:
      REMOTE_SUBNET: 172.29.0.0/24
      ROUTER_IP: 172.28.0.254
    networks:
      client_net:
        ipv4_address: 172.28.0.2

  server:
    build: ./server
    cap_add:
      - NET_ADMIN
    environment:
      REMOTE_SUBNET: 172.28.0.0/24
      ROUTER_IP: 172.29.0.254
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 1s
      timeout: 1s
      retries: 20
    networks:
      server_net:
        ipv4_address: 172.29.0.2

  router:
    build: ./router
    cap_add:
      - NET_ADMIN
      - NET_RAW
    depends_on:
      client:
        condition: service_started
      server:
        condition: service_healthy
    environment:
      LEFT_NEXT_HOP_IP: 172.28.0.2
      RIGHT_NEXT_HOP_IP: 172.29.0.2
      LEFT_SUBNET: 172.28.0.0/24
      RIGHT_SUBNET: 172.29.0.0/24
      LEFT_TO_RIGHT_DELAY_MS: ${ROUTER_ONE_WAY_DELAY_MS:-14}
      RIGHT_TO_LEFT_DELAY_MS: ${ROUTER_ONE_WAY_DELAY_MS:-14}
      LEFT_TO_RIGHT_RATE_MBPS: ${ROUTER_RATE_MBPS:-1000}
      RIGHT_TO_LEFT_RATE_MBPS: ${ROUTER_RATE_MBPS:-1000}
      LEFT_TO_RIGHT_LOSS_PERCENT: ${ROUTER_LOSS_PERCENT:-0}
      RIGHT_TO_LEFT_LOSS_PERCENT: ${ROUTER_LOSS_PERCENT:-0}
      LEFT_TO_RIGHT_QUEUE_BYTES: ${ROUTER_QUEUE_BYTES:-4194304}
      RIGHT_TO_LEFT_QUEUE_BYTES: ${ROUTER_QUEUE_BYTES:-4194304}
      ROUTER_SEED: ${ROUTER_SEED:-1}
      METRICS_INTERVAL_MS: ${METRICS_INTERVAL_MS:-1000}
    sysctls:
      net.ipv4.ip_forward: "0"
    networks:
      client_net:
        ipv4_address: 172.28.0.254
      server_net:
        ipv4_address: 172.29.0.254

networks:
  client_net:
    ipam:
      config:
        - subnet: 172.28.0.0/24
  server_net:
    ipam:
      config:
        - subnet: 172.29.0.0/24
